version: 2
before:
  hooks:
    - go mod download
builds:
  -
    main: ./cmd/putio-sync/main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - 386
      - amd64
    ignore:
      - goos: darwin
        goarch: 386
archives:
  - formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'
brews:
  - repository:
      owner: putdotio
      name: homebrew-putio-sync
    directory: Formula
    homepage:  https://github.com/putdotio/putio-sync
    description: Put.io folder sync app
    install: |
      bin.install "putio-sync"
    test: |
      system "#{bin}/putio-sync -version"
